networks:
  lfs261:
    driver: bridge

volumes:
  jenkins-docker-certs:
  jenkins-data:

services:
  jenkins: 
    image: jenkins/jenkins 
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8080:8080
      - 50000:50000
    environment:
      - DOCKER_HOST=tcp://docker:2376
      - DOCKER_CERT_PATH=/certs/client
      - DOCKER_TLS_VERIFY=1
    networks:
      - lfs261
    hostname: jenkins
    restart: always
    volumes:
      - jenkins-data:/var/jenkins_home
      - jenkins-docker-certs:/certs/client:ro
    depends_on:
      - docker

  docker:
    image: docker:dind
    ports:
      - 2376:2376
      - 5000:5000
      - 5001:5001
    environment:
      - DOCKER_TLS_CERTDIR=/certs
    networks:
      - lfs261
    privileged: true
    hostname: docker
    restart: always
    volumes:
      - jenkins-docker-certs:/certs/client
      - jenkins-data:/var/jenkins_home

  tunnel:
    # TODO Automatically configure System>Jenkins Location>Jenkins URL through JCasC
    image: ekzhang/bore
    command: local 8080 --to bore.pub --local-host jenkins
    depends_on:
      - jenkins
    networks:
      - lfs261
    #environment:
      #- BORE_SECRET=<SECRET>
      #- BORE_SERVER=<SERVER_IP>
    #profiles:
      #- tunnel

